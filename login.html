/* ===============================
   VALUE APP PREMIUM
=============================== */
.value-app{
  position: relative;

  display: inline-flex;
  align-items: center;
  gap: 8px;

  background: linear-gradient(
    135deg,
    #ffffff,
    #ff9b9b
  );

  border: 1px solid #ffd0d0;

  padding: 10px 16px;

  border-radius: 14px;

  font-weight: 600;
  font-size: 13px;

  color: #7a0000;

  overflow: hidden;

  cursor: pointer;

  transition:
    transform 0.25s ease,
    box-shadow 0.3s ease;

  box-shadow:
    0 6px 18px rgba(0,0,0,0.08);

  animation:
    valuePulse 2.5s infinite,
    valueShake 6s infinite;
}

/* ===============================
   ICON
=============================== */
.value-icon{
  width: 20px;
  height: 20px;

  object-fit: contain;

  border-radius: 6px;

  z-index: 2;

  animation: iconFloat 2s ease-in-out infinite;
}

/* ===============================
   TEKS DI ATAS EFEK
=============================== */
.value-app span{
  position: relative;
  z-index: 2;
}

/* ===============================
   EFEK CAHAYA BERJALAN
=============================== */
.value-app::before{
  content: "";

  position: absolute;

  top: -50%;
  left: -50%;

  width: 200%;
  height: 200%;

  background: linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.45),
    transparent
  );

  transform: rotate(25deg);

  animation: valueShine 3.5s linear infinite;
}

/* ===============================
   HOVER
=============================== */
.value-app:hover{
  transform: translateY(-3px) scale(1.03);

  box-shadow:
    0 12px 28px rgba(255,90,90,0.28);
}

/* ===============================
   KLIK
=============================== */
.value-app:active{
  transform: scale(0.97);
}

/* ===============================
   PULSE
=============================== */
@keyframes valuePulse{

  0%{
    box-shadow:
      0 0 0 0 rgba(255,120,120,0.4);
  }

  70%{
    box-shadow:
      0 0 0 12px rgba(255,120,120,0);
  }

  100%{
    box-shadow:
      0 0 0 0 rgba(255,120,120,0);
  }
}

/* ===============================
   GETAR HALUS
=============================== */
@keyframes valueShake{

  0%, 92%, 100%{
    transform: translateX(0);
  }

  94%{
    transform: translateX(-1px);
  }

  96%{
    transform: translateX(1px);
  }

  98%{
    transform: translateX(-1px);
  }
}

/* ===============================
   ICON NAIK TURUN
=============================== */
@keyframes iconFloat{

  0%,100%{
    transform: translateY(0);
  }

  50%{
    transform: translateY(-2px);
  }
}

/* ===============================
   SHINE
=============================== */
@keyframes valueShine{

  0%{
    transform:
      translateX(-100%)
      rotate(25deg);
  }

  100%{
    transform:
      translateX(100%)
      rotate(25deg);
  }
}

  animation:
    csPulse 2s infinite,
    csShake 5s infinite;
}

/* ===============================

=============================== */
.cs-icon{
  width: 22px;
  height: 22px;

  object-fit: contain;

  display: block;

  position: relative;

  z-index: 2;

  animation:
    iconFloat 2s ease-in-out infinite;
}

/* ===============================
   TEKS DI ATAS EFEK
=============================== */
#csbox span,
#csbox{
  z-index: 2;
}

/* ===============================
   EFEK CAHAYA BERJALAN
=============================== */
#csbox::before{
  content: "";

  position: absolute;

  top: -50%;
  left: -50%;

  width: 200%;
  height: 200%;

  background: linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.35),
    transparent
  );

  transform: rotate(25deg);

  animation: shine 3s linear infinite;
}

/* ===============================
   HOVER
=============================== */
#csbox:hover{
  transform: translateY(-2px) scale(1.03);

  box-shadow:
    0 10px 24px rgba(177,8,8,0.45);
}

/* ===============================
   KLIK
=============================== */
#csbox:active{
  transform: scale(0.97);
}

/* ===============================
   PULSE
=============================== */
@keyframes csPulse{

  0%{
    box-shadow:
      0 0 0 0 rgba(255,45,45,0.5);
  }

  70%{
    box-shadow:
      0 0 0 12px rgba(255,45,45,0);
  }

  100%{
    box-shadow:
      0 0 0 0 rgba(255,45,45,0);
  }
}

/* ===============================
   GETAR HALUS
=============================== */
@keyframes csShake{

  0%, 90%, 100%{
    transform: translateX(0);
  }

  92%{
    transform: translateX(-1px);
  }

  94%{
    transform: translateX(1px);
  }

  96%{
    transform: translateX(-1px);
  }

  98%{
    transform: translateX(1px);
  }
}

/* ===============================
   ICON FLOAT
=============================== */
@keyframes iconFloat{

  0%,100%{
    transform: translateY(0);
  }

  50%{
    transform: translateY(-2px);
  }
}

/* ===============================
   SHINE
=============================== */
@keyframes shine{

  0%{
    transform:
      translateX(-100%)
      rotate(25deg);
  }

  100%{
    transform:
      translateX(100%)
      rotate(25deg);
  }
}

    <input type="tel" id="noWa" placeholder="Masukkan Nomor HP" inputmode="tel" autocomplete="tel" aria-label="Nomor HP terdaftar">

    <span id="loginText" role="status" aria-live="polite"></span>
  </p>

  </button>

  <div class="popup-box">
    <img src="ajb.png" class="cs-logo" alt="Logo">
    <h3>Customer Service</h3>
    <div class="form-group">
      <label for="csHp">Nomor HP Terdaftar</label>
      <input type="text" id="csHp" placeholder="Masukkan nomor HP">
    </div>
    <div class="form-group">
      <label for="csKategori">Kategori Bantuan</label>
      <select id="csKategori">
        <option>Cara Pembayaran</option><option>Cara Login</option>
        <option>Cara Periksa Pembayaran</option><option>Cara Ganti Nomor HP</option>
        <option>Cara Salin Kode VA</option>
      </select>
    </div>

      <label for="csPesan">Pesan Lain</label>
      <textarea id="csPesan" placeholder="Tuliskan pesan anda"></textarea>
    </div>

      <button type="button" onclick="kirimCS()">Kirim</button>
      <button type="button" class="btn-batal" onclick="tutupCS()">Batal</button>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// Konfigurasi Firebase dipertahankan dari file lama.
const firebaseConfig = {
  apiKey: "AIzaSyDa5S7LeRuudC2ZWnOsW51asyOQ2WsXZGY",
  authDomain: "datapinjam-c6008.firebaseapp.com",
  projectId: "datapinjam-c6008",
  storageBucket: "datapinjam-c6008.firebasestorage.app",
  messagingSenderId: "937287862152",
  appId: "1:937287862152:web:7ea55a1e90be67c3591c3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const realtimeDB = getDatabase(app);
const loginBtn = document.getElementById("loginBtn");
const noWaInput = document.getElementById("noWa");
const msgEl = document.getElementById("loginText");
let loginBusy = false;
let statusTimer;

function showStatus(message) {
  msgEl.textContent = message;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { msgEl.textContent = ""; }, 4000);
}

// Pengaturan maintenance dari Realtime Database lama.
onValue(ref(realtimeDB, "setting/maintenance"), (snap) => {
  if (snap.val() === true && !location.pathname.includes("maintenance.html")) {
    location.href = "maintenance.html";
  }
}, (error) => console.error("Gagal membaca pengaturan maintenance:", error));

// Logo dan nama aplikasi dari setting/header.
onValue(ref(realtimeDB, "setting/header"), (snap) => {
  const data = snap.val();
  if (!data) return;
  if (data.logo) {
    document.getElementById("logoImg").src = data.logo;
    document.getElementById("logoHeader").src = data.logo;
  }
  document.getElementById("titleHeader").textContent = data.title || "Pinjamanku";
  document.getElementById("descHeader").textContent = data.desc || "Cek Tagihan & Pembayaran";
}, (error) => console.error("Gagal membaca pengaturan header:", error));

async function loginUser() {
  if (loginBusy) return;
  const noWa = noWaInput.value.trim();
  if (!noWa) {
    showStatus("Mohon masukkan nomor HP!");
    noWaInput.focus();
    return;
  }

  loginBusy = true;
  loginBtn.disabled = true;
  loginBtn.textContent = "Memeriksa...";
  const loader = document.createElement("div");
  loader.id = "loadingPopup";
  loader.innerHTML = `<div style="position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;justify-content:center;align-items:center;z-index:99999"><div style="width:55px;height:55px;border:5px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite"></div></div>`;
  document.body.appendChild(loader);

  try {
    const q = query(collection(db, "users"), where("noWa", "==", noWa));
    const snap = await getDocs(q);
    if (snap.empty) {
      showStatus("Nomor HP tidak terdaftar!");
      return;
    }

    const userData = snap.docs[0].data();
    // Format penyimpanan login dipertahankan agar kompatibel dengan halaman lama.
    localStorage.setItem("isLogin", "true");
    localStorage.setItem("userData", JSON.stringify(userData));
    showStatus("Login berhasil. Membuka halaman Saya...");
    await new Promise(resolve => setTimeout(resolve, 450));
    // Tujuan halaman sesuai permintaan: saya.html
    window.location.href = "saya.html";
  } catch (error) {
    console.error("Login gagal:", error);
    showStatus("Terjadi kesalahan saat menghubungkan ke server. Coba lagi.");
  } finally {
    document.getElementById("loadingPopup")?.remove();
    loginBusy = false;
    loginBtn.disabled = false;
    loginBtn.textContent = "Login";
  }
}

loginBtn.addEventListener("click", loginUser);
noWaInput.addEventListener("keydown", (event) => {
  if (event.key === "Enter") loginUser();
});

// Popup bantuan pelanggan dari desain lama.
document.getElementById("csbox").addEventListener("click", () => {
  document.getElementById("csPopup").style.display = "flex";
});
window.tutupCS = function () {
  document.getElementById("csPopup").style.display = "none";
};
window.kirimCS = function () {
  const hp = document.getElementById("csHp").value.trim();
  const kategori = document.getElementById("csKategori").value;
  const pesan = document.getElementById("csPesan").value.trim();
  if (!hp) { showStatus("Masukkan nomor HP terdaftar pada formulir bantuan."); return; }
  if (!pesan) { showStatus("Silakan tulis pesan bantuan."); return; }
  const nomorCS = "6283863319230";
  const text = `Halo CS Rupiahsegar, saya butuh bantuan!

Nomor HP Terdaftar : ${hp}
Kategori Bantuan : ${kategori}

Pesan :
${pesan}`;
  window.open("https://wa.me/" + nomorCS + "?text=" + encodeURIComponent(text), "_blank", "noopener,noreferrer");
  window.tutupCS();
};
</script>
